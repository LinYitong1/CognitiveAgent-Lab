# CI gate for CognitiveAgent Lab — mirrors the local scripts/check.sh six gates:
#   G-1 pytest full suite, G-2 coverage command, G-3 secret scan,
#   G-4 layering check, G-5a pyright, G-5b compileall.
# No LLM keys are needed: all tests run against FakeLLM / deterministic engines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/pip install pytest pytest-asyncio pytest-cov pyright

      - name: G-1 Full test suite (FakeLLM / deterministic, no keys)
        env:
          CALC_AGENT_ENV_FILE: /dev/null
        run: .venv/bin/python -m pytest

      - name: G-2 Coverage gate (fails under 85%)
        env:
          CALC_AGENT_ENV_FILE: /dev/null
        run: .venv/bin/python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: G-3 Secret scan (git grep rc=1 passes)
        run: |
          # Scans git-tracked text files only (-I skips binaries). Scope: code
          # and maintained user-facing docs; archival docs under
          # docs/handoff|plans|proposals|research are excluded. The
          # (^|[^a-z0-9_]) prefix class prevents false positives on identifiers
          # like "task-creation" / "task-<hex>" (letters sk- inside "task-").
          # GitHub Actions runs this with `bash -e`, and grep's PASS state is
          # exit 1 — so the exit code must be captured with `|| rc=$?` rather
          # than read after the command (the -e shell aborts otherwise).
          rc=0
          git grep -nIiE "(^|[^a-z0-9_])sk-[a-z0-9_-]{8,}|api[_-]?key[[:space:]]*=[[:space:]]*[\"'][^\"']+" \
            -- src tests web examples skills scripts README.md .env.example pyproject.toml .github docs \
            ':!docs/handoff' ':!docs/plans' ':!docs/proposals' ':!docs/research' || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "G-3 PASS: no hardcoded secrets"
          else
            echo "G-3 FAIL: suspected hardcoded secrets (git grep rc=${rc})"
            exit 1
          fi

      - name: G-4 Layering dependency check
        run: .venv/bin/python -m scripts.check_layers

      - name: G-5a Static type check (pyright)
        run: .venv/bin/python -m pyright src/

      - name: G-5b Syntax compile check
        run: .venv/bin/python -m compileall -q src/
