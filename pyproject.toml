[project]
name = "cognitive-agent-lab"
version = "0.1.0"
description = "CognitiveAgent Lab — deterministic experiment-to-game pipeline on an AI Agent runtime (ExperimentSpec -> trials -> GameSpec -> single-file playable HTML)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ 本身是顶层包（import 路径为 src.xxx，为冻结 M1/Phase A 代码零改动而保留）
[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "loop: M1-1 agent loop integration tests",
    "max_steps: M1-4 step limit tests",
    "tool_failure: M1-3 tool failure resilience tests",
    "tool_security: M1-5 tool security boundary tests",
]

[tool.pyright]
# 显式指定解释器环境，保证 `pyright src/` 解析到 .venv 的依赖
venvPath = "."
venv = ".venv"
