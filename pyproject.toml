[project]
name = "cognitive-agent-lab"
version = "0.1.0"
description = "CognitiveAgent Lab — deterministic experiment-to-game pipeline on an AI Agent runtime (ExperimentSpec -> trials -> GameSpec -> single-file playable HTML)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "openai",
]

[project.scripts]
cognitive-agent = "src.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# src/ itself is the top-level package (import path is src.xxx, kept for zero changes to frozen M1/Phase A code)
[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "loop: M1-1 agent loop integration tests",
    "max_steps: M1-4 step limit tests",
    "tool_failure: M1-3 tool failure resilience tests",
    "tool_security: M1-5 tool security boundary tests",
]

[tool.pyright]
# explicit interpreter environment so `pyright src/` resolves dependencies from .venv
venvPath = "."
venv = ".venv"
